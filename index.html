                `).join('') : '<div class="col-span-2 italic text-slate-500">Đã lưu trữ trong hồ sơ sao lưu.</div>'}
              </div>
            </div>

            <div class="mb-2">
              <div class="font-extrabold text-navy uppercase text-[10.5px] bg-slate-100 px-2 py-0.5 border border-slate-400 border-b-0">II. Các Yêu cầu An toàn bắt buộc</div>
              <div class="border border-slate-400 p-1.5 space-y-0.5 text-[10px] leading-snug">
                ${(p.safetyRequirements && p.safetyRequirements.length > 0) ? p.safetyRequirements.map((req, idx) => `
                  <div><strong>${idx + 1}.</strong> ${escapeHtml(req)}</div>
                `).join('') : '<div class="italic text-slate-500">Đã lưu trữ trong hồ sơ sao lưu.</div>'}
              </div>
            </div>

            <div class="mb-2">
              <div class="font-extrabold text-navy uppercase text-[10.5px] bg-slate-100 px-2 py-0.5 border border-slate-400 border-b-0">III. Bảng Từng bước Công việc &amp; Đánh giá Rủi ro (JSA)</div>
              <table class="w-full border-collapse border border-slate-400 text-[10px]">
                <thead class="bg-slate-50">
                  <tr>
                    <th class="border border-slate-400 p-1 w-7">STT</th>
                    <th class="border border-slate-400 p-1 text-left w-1/3">Bước công việc</th>
                    <th class="border border-slate-400 p-1 text-left w-1/3">Mối nguy tiềm ẩn</th>
                    <th class="border border-slate-400 p-1 text-left">Biện pháp kiểm soát</th>
                  </tr>
                </thead>
                <tbody>
                  ${(p.jsa && p.jsa.length > 0) ? p.jsa.map((row, idx) => `
                    <tr>
                      <td class="border border-slate-400 p-1 text-center font-bold">${idx + 1}</td>
                      <td class="border border-slate-400 p-1">${escapeHtml(row.step)}</td>
                      <td class="border border-slate-400 p-1">${escapeHtml(row.hazard)}</td>
                      <td class="border border-slate-400 p-1">${escapeHtml(row.control)}</td>
                    </tr>
                  `).join('') : '<tr><td colspan="4" class="border border-slate-400 p-1.5 italic text-slate-500 text-center">Đã lưu trữ trong hồ sơ sao lưu.</td></tr>'}
                </tbody>
              </table>
            </div>
          </div>

          <div class="border-2 border-navy rounded p-2 bg-slate-50/70 mt-auto">
            <div class="flex items-center justify-between border-b border-slate-300 pb-1 mb-1.5">
              <div class="font-black text-navy uppercase text-[10.5px]">IV. Xác nhận Hoàn thành Công việc &amp; 5S Hiện trạng Khu vực Làm việc</div>
              <div class="text-[10px] text-slate-600 font-semibold">Ngày đóng GP: ....../....../20......</div>
            </div>
            <div class="grid grid-cols-2 gap-x-4 gap-y-0.5 text-[10px] mb-2">
              <div>☐ Công việc đã hoàn thành đúng hạng mục đăng ký.</div>
              <div>☐ Khu vực đã vệ sinh 5S sạch sẽ, thu gom hết rác &amp; vật tư.</div>
              <div>☐ Không còn nguy cơ cháy nổ / tàn lửa / rò rỉ hóa chất.</div>
              <div>☐ Đã tháo khóa LOTO, khôi phục thiết bị về trạng thái an toàn.</div>
            </div>
            <div class="grid grid-cols-3 gap-2 text-center text-[10px]">
              <div class="border border-slate-400 bg-white p-1.5 rounded">
                <div class="font-bold text-navy">Đại diện Nhà thầu</div>
                <div class="text-[9px] text-slate-400">(Ký, ghi rõ họ tên &amp; giờ)</div>
                <div class="h-9"></div>
                <div class="text-[9px] text-slate-500 border-t border-dashed border-slate-300 pt-0.5">Giờ: ....... : .......</div>
              </div>
              <div class="border border-slate-400 bg-white p-1.5 rounded">
                <div class="font-bold text-navy">Người quản lý dự án</div>
                <div class="text-[9px] text-slate-400">(Kiểm tra 5S &amp; ký xác nhận)</div>
                <div class="h-9"></div>
                <div class="text-[9px] text-slate-500 border-t border-dashed border-slate-300 pt-0.5">Giờ: ....... : .......</div>
              </div>
              <div class="border border-slate-400 bg-white p-1.5 rounded">
                <div class="font-bold text-navy">Bộ phận EHS</div>
                <div class="text-[9px] text-slate-400">(Xác nhận đóng giấy phép)</div>
                <div class="h-9"></div>
                <div class="text-[9px] text-slate-500 border-t border-dashed border-slate-300 pt-0.5">Giờ: ....... : .......</div>
              </div>
            </div>
          </div>
        </div>
      `;

      const sheet2 = `
        <div class="a4-sheet text-xs text-slate-800">
          <div class="flex items-center justify-between border-b-2 border-navy pb-2.5 mb-4">
            <div class="flex items-center gap-3">
              ${buildBoydEatonSVG(70)}
              <div>
                <div class="text-base font-black text-navy uppercase">DANH SÁCH NHÂN SỰ THAM GIA THI CÔNG</div>
                <div class="text-xs text-slate-500">Mã GP: ${escapeHtml(p.id)} • Nhà thầu: ${escapeHtml(p.contractorName)} • Tờ 2/4</div>
              </div>
            </div>
          </div>

          <div class="mb-3 p-3 rounded-xl bg-slate-50 border border-slate-300 text-xs grid grid-cols-2 gap-2">
            <div><strong>Dự án:</strong> ${escapeHtml(p.projectName)}</div>
            <div><strong>Tổng số người đăng ký:</strong> ${p.workers.length} người</div>
            <div><strong>Thời gian:</strong> ${formatDateVN(p.startDate)} → ${formatDateVN(p.endDate)}</div>
            <div><strong>Khu vực:</strong> ${escapeHtml(p.factory)} • ${escapeHtml(p.floor || 'Tầng 1')} — ${escapeHtml(p.zoneName)}</div>
          </div>

          <table class="w-full border-collapse border border-slate-400 text-xs">
            <thead class="bg-slate-100">
              <tr>
                <th class="border border-slate-400 p-2 w-12">STT</th>
                <th class="border border-slate-400 p-2 text-left">Họ và tên</th>
                <th class="border border-slate-400 p-2 w-20">Tuổi</th>
                <th class="border border-slate-400 p-2 text-left">Số CCCD / CMND</th>
                <th class="border border-slate-400 p-2 w-36">Ký tên xác nhận an toàn</th>
              </tr>
            </thead>
            <tbody>
              ${p.workers.map((wk, idx) => `
                <tr>
                  <td class="border border-slate-400 p-2 text-center font-bold">${idx + 1}</td>
                  <td class="border border-slate-400 p-2 font-bold">${escapeHtml(wk.name)}</td>
                  <td class="border border-slate-400 p-2 text-center">${escapeHtml(wk.age)}</td>
                  <td class="border border-slate-400 p-2 font-mono">${escapeHtml(wk.idCard)}</td>
                  <td class="border border-slate-400 p-2"></td>
                </tr>
              `).join('')}
            </tbody>
          </table>
        </div>
      `;

      const sheet3 = `
        <div class="a4-sheet text-xs text-slate-800">
          <div class="flex items-center justify-between border-b-2 border-navy pb-2.5 mb-4">
            <div class="flex items-center gap-3">
              ${buildBoydEatonSVG(70)}
              <div>
                <div class="text-base font-black text-navy uppercase">BẢN CAM KẾT TUÂN THỦ AN TOÀN LAO ĐỘNG</div>
                <div class="text-xs text-slate-500">Mã GP: ${escapeHtml(p.id)} • BOYD THERMAL by EATON • Tờ 3/4</div>
              </div>
            </div>
          </div>

          <div class="space-y-3 leading-relaxed text-[13px] p-4 rounded-xl border border-slate-300 bg-slate-50/50">
            <p><strong>Đơn vị Nhà thầu:</strong> ${escapeHtml(p.contractorName)}</p>
            <p><strong>Người phụ trách trực tiếp:</strong> ${escapeHtml(p.contractorSupervisor)} — <strong>SĐT:</strong> ${escapeHtml(p.contractorPhone)}</p>
            <p><strong>Hạng mục thi công:</strong> ${escapeHtml(p.projectName)}</p>
            <hr class="border-slate-300 my-2" />
            <p>Chúng tôi cam kết tuân thủ tuyệt đối các nội dung sau trong suốt thời gian làm việc tại nhà máy BOYD:</p>
            <ol class="list-decimal pl-5 space-y-2">
              <li>Chấp hành đầy đủ tất cả các yêu cầu về Trang bị bảo hộ cá nhân (PPE), quy trình đánh giá rủi ro JSA và các biện pháp an toàn đã ghi trong Giấy phép Làm việc.</li>
              <li>Chỉ tổ chức thi công đúng phạm vi khu vực <strong>${escapeHtml(p.factory)} • ${escapeHtml(p.floor || 'Tầng 1')} — ${escapeHtml(p.zoneName)}</strong> và đúng khung giờ đã được phê duyệt.</li>
              <li>Tất cả thiết bị, dụng cụ mang vào nhà máy đều đảm bảo tiêu chuẩn an toàn, có kiểm định hợp lệ; không tự ý đấu nối nguồn điện, khí nén hoặc vận hành thiết bị của nhà máy khi chưa được phép.</li>
              <li>Giữ gìn vệ sinh công nghiệp 5S, thu gom rác thải đúng nơi quy định và chịu hoàn toàn trách nhiệm bồi thường nếu xảy ra sự cố gây thiệt hại về người hoặc tài sản do lỗi vi phạm an toàn của nhà thầu.</li>
              <li>Chấp hành vô điều kiện yêu cầu tạm dừng thi công từ Người quản lý dự án hoặc Bộ phận EHS nếu phát hiện bất kỳ nguy cơ mất an toàn nào.</li>
            </ol>
            <div class="mt-4 p-3 rounded-lg bg-emerald-50 border border-emerald-300 text-emerald-900 font-bold">
              ☑ Đã xác nhận điện tử: "Đồng ý, đã đọc rõ các yêu cầu và cam kết chấp hành các yêu cầu an toàn của công ty."
            </div>
          </div>

          <div class="grid grid-cols-2 gap-6 mt-10 text-center">
            <div>
              <div class="font-bold uppercase">Đại diện Nhà thầu cam kết</div>
              <div class="text-[11px] text-slate-500">(Ký &amp; ghi rõ họ tên)</div>
              <div class="h-20"></div>
              <div class="font-bold text-navy">${escapeHtml(p.contractorSupervisor)}</div>
            </div>
            <div>
              <div class="font-bold uppercase">Xác nhận Bộ phận Quản lý</div>
              <div class="text-[11px] text-slate-500">(Ký &amp; ghi rõ họ tên)</div>
              <div class="h-20"></div>
              <div class="font-bold text-navy">${escapeHtml(p.managerName)}</div>
            </div>
          </div>
        </div>
      `;

      const sheet4 = `
        <div class="a4-sheet text-xs text-slate-800">
          <div class="flex items-center justify-between border-b-2 border-navy pb-2.5 mb-4">
            <div class="flex items-center gap-3">
              ${buildBoydEatonSVG(70)}
              <div>
                <div class="text-base font-black text-navy uppercase">BẢN ĐỒ KHU VỰC LÀM VIỆC ĐƯỢC CẤP PHÉP</div>
                <div class="text-xs text-slate-500">Mã GP: ${escapeHtml(p.id)} • Nhà máy ${escapeHtml(p.factory)} • ${escapeHtml(p.floor || 'Tầng 1')} • Tờ 4/4</div>
              </div>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3 mb-4 p-3 rounded-xl bg-slate-100 border border-slate-300 text-xs">
            <div><strong>Nhà máy / Tầng:</strong> ${escapeHtml(p.factory)} — ${escapeHtml(p.floor || 'Tầng 1')}</div>
            <div><strong>Khu vực đăng ký:</strong> <span class="text-red-700 font-extrabold">${escapeHtml(p.zoneId)} — ${escapeHtml(p.zoneName)}</span></div>
            <div class="col-span-2"><strong>Vị trí cụ thể:</strong> ${escapeHtml(p.locationDetail)}</div>
            <div class="col-span-2"><strong>Thời gian hiệu lực:</strong> ${formatDateVN(p.startDate)} → ${formatDateVN(p.endDate)} (${p.startTime} - ${p.endTime})</div>
          </div>

          <div class="my-2">
            ${renderZoneGridMap(p.factory, p.floor || 'Tầng 1', p.zoneId, false, false)}
          </div>

          <div class="mt-4 p-3 rounded-xl border border-red-300 bg-red-50 text-xs text-red-800 font-semibold">
            <i class="fa-solid fa-circle-exclamation mr-1"></i> Lưu ý: Ô khu vực tô màu đỏ nổi bật trên sơ đồ là phạm vi duy nhất nhà thầu được phép thi công. Nghiêm cấm đi vào các khu vực sản xuất khác không liên quan.
          </div>
        </div>
      `;

      document.getElementById('modal-root').innerHTML = `
        <div id="print-modal-overlay" class="fixed inset-0 z-50 bg-slate-900/75 backdrop-blur-sm overflow-y-auto p-3 sm:p-6">
          <div id="print-modal-container" class="max-w-[220mm] mx-auto">
            <div class="no-print sticky top-0 z-20 mb-4 bg-navy text-white px-4 py-3 rounded-2xl shadow-xl flex items-center justify-between gap-3">
              <div>
                <div class="text-sm font-extrabold">Hồ sơ Giấy phép Làm việc — ${escapeHtml(p.id)} (Trọn bộ 4 tờ A4)</div>
                <div class="text-[11px] text-sky-300">Tờ 1: Giấy phép (3 dấu đỏ + PPE + 5S) • Tờ 2: Nhân sự • Tờ 3: Cam kết • Tờ 4: Sơ đồ khu vực</div>
              </div>
              <div class="flex items-center gap-2">
                <button onclick="window.print()" class="px-4 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-white text-xs sm:text-sm font-extrabold shadow flex items-center gap-1.5">
                  <i class="fa-solid fa-print"></i> In cả 4 tờ A4
                </button>
                <button onclick="closeModal()" class="w-9 h-9 rounded-xl bg-white/15 hover:bg-white/25 flex items-center justify-center">
                  <i class="fa-solid fa-xmark"></i>
                </button>
              </div>
            </div>

            ${sheet1}
            ${sheet2}
            ${sheet3}
            ${sheet4}
          </div>
        </div>
      `;
    }

    // =========================================================================
    // 17. BOOTSTRAP APPLICATION (AUTO-INIT SUPABASE)
    // =========================================================================
    window.addEventListener('DOMContentLoaded', async () => {
      renderAll();
      await DB.init();
      state.appReady = true;
      applySafetyTemplateToWizard('GENERAL');
      renderAll();
    });
  </script>
</body>
</html>
