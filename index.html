    // =========================================================================
    // 3. DATE & FORMAT UTILITIES
    // =========================================================================
    function formatDateISO(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    function getTomorrowISO() {
      const d = new Date();
      d.setDate(d.getDate() + 1);
      return formatDateISO(d);
    }

    function addDaysISO(isoDate, days) {
      const [y, m, d] = isoDate.split('-').map(Number);
      const dt = new Date(y, m - 1, d);
      dt.setDate(dt.getDate() + days);
      return formatDateISO(dt);
    }

    function formatDateVN(isoDate) {
      if (!isoDate) return '';
      const parts = isoDate.split('-');
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatDateTimeVN(isoStr) {
      if (!isoStr) return '';
      const d = new Date(isoStr);
      if (isNaN(d.getTime())) return isoStr;
      return `${String(d.getDate()).padStart(2, '0')}/${String(d.getMonth() + 1).padStart(2, '0')}/${d.getFullYear()} ${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getPermitTypeMeta(code) {
      return PERMIT_TYPES.find(t => t.code === code) || PERMIT_TYPES[0];
    }

    function statusBadgeHTML(status) {
      const map = {
        PENDING_MANAGER: '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-amber-100 text-amber-800 border border-amber-200">Chờ Quản lý duyệt</span>',
        PENDING_EHS: '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-sky-100 text-sky-800 border border-sky-200">Chờ EHS duyệt</span>',
        APPROVED: '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-100 text-emerald-800 border border-emerald-200">Đã phê duyệt</span>',
        REJECTED_MANAGER: '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-red-100 text-red-700 border border-red-200">Quản lý từ chối</span>',
        REJECTED_EHS: '<span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-rose-100 text-rose-700 border border-rose-200">EHS từ chối</span>'
      };
      return map[status] || `<span class="px-2 py-0.5 rounded text-xs bg-slate-100 text-slate-600">${escapeHtml(status)}</span>`;
    }

    // =========================================================================
    // 4. DATABASE LAYER (SUPABASE CLOUD + LOCALSTORAGE FALLBACK)
    // =========================================================================
    function createEmptyData() {
      return {
        ehsAccount: { username: 'admin', password: 'admin', fullName: 'Bộ phận EHS BOYD' },
        managers: [],
        contractors: [],
        zones: { B1: [], B2: [], B3: [], B4: [] },
        safetyTemplates: createDefaultSafetyTemplates(),
        permits: [],
        deletedPermits: []
      };
    }

    function normalizeDbObject(rawObj) {
      const seed = createEmptyData();
      const defaultTpls = createDefaultSafetyTemplates();
      const parsed = rawObj && typeof rawObj === 'object' ? rawObj : seed;

      if (!parsed.ehsAccount || !parsed.ehsAccount.username) parsed.ehsAccount = seed.ehsAccount;
      if (!Array.isArray(parsed.managers)) parsed.managers = [];
      if (!Array.isArray(parsed.contractors)) parsed.contractors = [];
      if (!parsed.zones || typeof parsed.zones !== 'object') parsed.zones = seed.zones;
      FACTORY_LIST.forEach(fac => {
        if (!Array.isArray(parsed.zones[fac])) parsed.zones[fac] = [];
        parsed.zones[fac].forEach(z => {
          if (!z.floor) z.floor = 'Tầng 1';
          if (z.floor === 'Tầng 3') z.floor = 'Outside';
        });
      });
      if (!parsed.safetyTemplates || typeof parsed.safetyTemplates !== 'object') parsed.safetyTemplates = seed.safetyTemplates;
      PERMIT_TYPES.forEach(pt => {
        if (!parsed.safetyTemplates[pt.code]) {
          parsed.safetyTemplates[pt.code] = defaultTpls[pt.code];
        } else if (!Array.isArray(parsed.safetyTemplates[pt.code].ppe)) {
          parsed.safetyTemplates[pt.code].ppe = [...defaultTpls[pt.code].ppe];
        }
      });
      if (!Array.isArray(parsed.permits)) parsed.permits = [];
      parsed.permits.forEach(p => {
        if (!p.floor) p.floor = 'Tầng 1';
        if (p.floor === 'Tầng 3') p.floor = 'Outside';
        if (!Array.isArray(p.ppe)) {
          const tpl = parsed.safetyTemplates[p.permitType] || defaultTpls.GENERAL;
          p.ppe = p.archived ? [] : [...(tpl.ppe || [])];
        }
      });
      if (!Array.isArray(parsed.deletedPermits)) parsed.deletedPermits = [];
      return parsed;
    }

    const DB = {
      cloudOnline: false,
      isSyncing: false,

      loadLocal() {
        try {
          const raw = localStorage.getItem(DB_KEY);
          if (!raw) {
            const empty = createEmptyData();
            localStorage.setItem(DB_KEY, JSON.stringify(empty));
            return empty;
          }
          return normalizeDbObject(JSON.parse(raw));
        } catch (err) {
          console.error('Local load error:', err);
          return createEmptyData();
        }
      },

      saveLocal(data) {
        try {
          localStorage.setItem(DB_KEY, JSON.stringify(data));
        } catch (err) {
          console.error('Local save error:', err);
        }
      },

      async init() {
        if (!supabaseClient) {
          this.cloudOnline = false;
          db = this.loadLocal();
          return;
        }
        await this.refreshFromCloud(true);
      },

      async refreshFromCloud(silent = false) {
        if (!supabaseClient) return;
        this.isSyncing = true;
        try {
          const [settingsRes, permitsRes, deletedRes] = await Promise.all([
            supabaseClient.from('eptw_settings').select('key, value'),
            supabaseClient.from('eptw_permits').select('data').order('created_at', { ascending: false }),
            supabaseClient.from('eptw_deleted_permits').select('data').order('deleted_at', { ascending: false })
          ]);

          if (settingsRes.error) throw settingsRes.error;
          if (permitsRes.error) throw permitsRes.error;
          if (deletedRes.error) throw deletedRes.error;

          const base = createEmptyData();
          const existingKeys = new Set();
          (settingsRes.data || []).forEach(row => {
            existingKeys.add(row.key);
            base[row.key] = row.value;
          });

          base.permits = (permitsRes.data || []).map(r => r.data);
          base.deletedPermits = (deletedRes.data || []).map(r => r.data);
          db = normalizeDbObject(base);

          // Khởi tạo các khóa cấu hình mặc định lên Supabase trong lần chạy đầu tiên
          const requiredKeys = ['ehsAccount', 'managers', 'contractors', 'zones', 'safetyTemplates'];
          const missingRows = requiredKeys
            .filter(k => !existingKeys.has(k))
            .map(k => ({ key: k, value: db[k], updated_at: new Date().toISOString() }));

          if (missingRows.length > 0) {
            await supabaseClient.from('eptw_settings').upsert(missingRows, { onConflict: 'key' });
          }

          this.cloudOnline = true;
          this.saveLocal(db);
          if (!silent) showToast('Đã đồng bộ dữ liệu mới nhất từ Supabase!', 'success');
        } catch (err) {
          console.error('Supabase sync error:', err);
          this.cloudOnline = false;
          db = this.loadLocal();
          showToast('Không thể kết nối Supabase (đang dùng dữ liệu Local). Kiểm tra lại URL/Key hoặc bảng SQL.', 'warning');
        } finally {
          this.isSyncing = false;
        }
      },

      async saveSetting(key, value) {
        db[key] = value;
        this.saveLocal(db);
        if (!supabaseClient) return true;
        try {
          const { error } = await supabaseClient
            .from('eptw_settings')
            .upsert({ key, value, updated_at: new Date().toISOString() }, { onConflict: 'key' });
          if (error) throw error;
          this.cloudOnline = true;
          return true;
        } catch (err) {
          console.error('saveSetting error:', err);
          showToast('Lỗi đồng bộ cấu hình lên Supabase: ' + err.message, 'error');
          return false;
        }
      },

      async upsertPermit(permit) {
        this.saveLocal(db);
        if (!supabaseClient) return true;
        try {
          const { error } = await supabaseClient
            .from('eptw_permits')
            .upsert({
              id: permit.id,
              status: permit.status,
              start_date: permit.startDate,
              manager_username: permit.managerUsername,
              data: permit,
              created_at: permit.createdAt || new Date().toISOString(),
              updated_at: new Date().toISOString()
            }, { onConflict: 'id' });
          if (error) throw error;
          this.cloudOnline = true;
          return true;
        } catch (err) {
          console.error('upsertPermit error:', err);
          showToast('Lỗi lưu giấy phép lên Supabase: ' + err.message, 'error');
          return false;
        }
      },

      async upsertPermitsBatch(permitsList) {
        this.saveLocal(db);
        if (!supabaseClient || !permitsList.length) return true;
        try {
          const rows = permitsList.map(p => ({
            id: p.id,
            status: p.status,
            start_date: p.startDate,
            manager_username: p.managerUsername,
            data: p,
            created_at: p.createdAt || new Date().toISOString(),
            updated_at: new Date().toISOString()
          }));
          const { error } = await supabaseClient.from('eptw_permits').upsert(rows, { onConflict: 'id' });
          if (error) throw error;
          this.cloudOnline = true;
          return true;
        } catch (err) {
          console.error('upsertPermitsBatch error:', err);
          showToast('Lỗi cập nhật hàng loạt lên Supabase: ' + err.message, 'error');
          return false;
        }
      },

      async deletePermit(permitId, deletedRecord) {
        this.saveLocal(db);
        if (!supabaseClient) return true;
        try {
          const [delRes, insRes] = await Promise.all([
            supabaseClient.from('eptw_permits').delete().eq('id', permitId),
            supabaseClient.from('eptw_deleted_permits').upsert({
              id: deletedRecord.id,
              data: deletedRecord,
              deleted_at: deletedRecord.deletedAt || new Date().toISOString()
            }, { onConflict: 'id' })
          ]);
          if (delRes.error) throw delRes.error;
          if (insRes.error) throw insRes.error;
          this.cloudOnline = true;
          return true;
        } catch (err) {
          console.error('deletePermit error:', err);
          showToast('Lỗi xóa giấy phép trên Supabase: ' + err.message, 'error');
          return false;
        }
      }
    };

    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const colors = {
        success: 'bg-emerald-600 text-white border-emerald-700',
        error: 'bg-red-600 text-white border-red-700',
        warning: 'bg-amber-500 text-white border-amber-600',
        info: 'bg-navy text-white border-slate-800'
      };
      const icons = {
        success: 'fa-circle-check',
        error: 'fa-circle-xmark',
        warning: 'fa-triangle-exclamation',
        info: 'fa-circle-info'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center gap-2.5 px-4 py-3 rounded-xl shadow-lg border text-sm font-semibold transition-all duration-300 ${colors[type] || colors.info}`;
      el.innerHTML = `<i class="fa-solid ${icons[type] || icons.info} text-base"></i><span class="flex-1">${escapeHtml(message)}</span>`;
      container.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 300);
      }, 3200);
    }

    // =========================================================================
    function renderMain() {
      const main = document.getElementById('app-main');
      if (!state.appReady) {
        main.innerHTML = `
          <div class="max-w-md mx-auto mt-16 bg-white rounded-3xl border border-slate-200 p-8 text-center shadow-sm space-y-3">
            <i class="fa-solid fa-circle-notch fa-spin text-3xl text-eaton"></i>
            <div class="text-sm font-extrabold text-navy">Đang kết nối dữ liệu hệ thống BOYD E-PTW...</div>
          </div>
        `;
        return;
      }

      try {
        if (state.view === 'HOME') {
          renderHomeView(main);
        } else if (state.view === 'CONTRACTOR') {
          renderPermitWizardContainer(main, 'CONTRACTOR');
        } else if (state.view === 'MANAGEMENT') {
          if (!state.currentManager) renderManagementAuth(main);
          else renderManagementDashboard(main);
        } else if (state.view === 'EHS') {
          if (!state.ehsLoggedIn) renderEhsAuth(main);
          else renderEhsDashboard(main);
        }
      } catch (err) {
        console.error('Render error:', err);
        main.innerHTML = `
          <div class="bg-red-50 border border-red-200 rounded-2xl p-6 text-center max-w-lg mx-auto">
            <i class="fa-solid fa-triangle-exclamation text-3xl text-red-500 mb-2"></i>
            <div class="font-bold text-red-800">Đã xảy ra lỗi hiển thị giao diện</div>
            <p class="text-xs text-red-600 mt-1">${escapeHtml(err.message)}</p>
            <button onclick="navigateTo('HOME')" class="mt-4 px-4 py-2 rounded-xl bg-navy text-white text-xs font-bold">Quay về Trang chủ</button>
          </div>
        `;
      }
    }

    // =========================================================================
    // 9. HOME VIEW: LOGO -> TỔNG HỢP (THỐNG KÊ) -> BẢNG CHỌN
    // =========================================================================
    function renderHomeView(container) {
      const yearsSet = new Set([String(nowDate.getFullYear()), String(nowDate.getFullYear() - 1), String(nowDate.getFullYear() + 1)]);
      db.permits.forEach(p => {
        if (p.startDate && p.startDate.length >= 4) yearsSet.add(p.startDate.slice(0, 4));
      });
      const yearOptions = Array.from(yearsSet).sort((a, b) => Number(b) - Number(a));

      const filteredPermits = db.permits.filter(p => {
        if (!p.startDate) return false;
        const [py, pm] = p.startDate.split('-');
        if (state.homeFilterYear !== 'ALL' && py !== state.homeFilterYear) return false;
        if (state.homeFilterMonth !== 'ALL' && Number(pm) !== Number(state.homeFilterMonth)) return false;
        return true;
      });

      const stats = {
        total: filteredPermits.length,
        pendingMgmt: filteredPermits.filter(p => p.status === 'PENDING_MANAGER').length,
        pendingEhs: filteredPermits.filter(p => p.status === 'PENDING_EHS').length,
        approved: filteredPermits.filter(p => p.status === 'APPROVED').length,
        rejected: filteredPermits.filter(p => p.status === 'REJECTED_MANAGER' || p.status === 'REJECTED_EHS').length
      };

      const filterText = state.homeFilterMonth === 'ALL'
        ? (state.homeFilterYear === 'ALL' ? 'Tất cả thời gian' : `Cả năm ${state.homeFilterYear}`)
        : `Tháng ${state.homeFilterMonth}/${state.homeFilterYear === 'ALL' ? 'Tất cả' : state.homeFilterYear}`;

      container.innerHTML = `
        <div class="space-y-6 max-w-5xl mx-auto">
          <!-- 1. LOGO & THƯƠNG HIỆU -->
          <section class="bg-white rounded-3xl border border-slate-200 shadow-sm px-6 py-5 flex flex-col sm:flex-row items-center justify-between gap-5">
            <div class="flex flex-col sm:flex-row items-center gap-5 text-center sm:text-left">
              <div class="p-2.5 rounded-2xl bg-slate-50 border border-slate-100">
                ${buildBoydEatonSVG(112)}
              </div>
              <div>
                <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-blue-50 border border-blue-200 text-[11px] font-extrabold text-eaton uppercase tracking-wider mb-1.5">
                  <i class="fa-solid fa-shield-halved"></i> Permit To Work System
                </div>
                <h1 class="text-xl sm:text-2xl font-black text-navy tracking-tight">
                  HỆ THỐNG ĐĂNG KÝ GIẤY PHÉP LÀM VIỆC (E-PTW)
                </h1>
                <p class="text-xs sm:text-sm text-slate-500 mt-1">
                  Kiểm soát an toàn nhà thầu, đánh giá rủi ro JSA, yêu cầu PPE và phê duyệt trực tuyến tại nhà máy B1–B4.
                </p>
              </div>
            </div>
          </section>

          <!-- 2. TỔNG HỢP THỐNG KÊ (LỌC THEO THÁNG / NĂM) -->
          <section class="bg-white rounded-3xl border border-slate-200 shadow-sm p-5 space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 border-b border-slate-100 pb-3.5">
              <div>
                <h2 class="text-sm sm:text-base font-extrabold text-navy flex items-center gap-2">
                  <i class="fa-solid fa-chart-pie text-eaton"></i>
                  Tổng hợp Giấy phép Làm việc
                  <span class="text-xs font-semibold text-slate-400">(${escapeHtml(filterText)})</span>
                </h2>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5">
                  <i class="fa-regular fa-calendar text-slate-400 text-xs"></i>
                  <select onchange="state.homeFilterMonth = this.value; renderMain();" class="bg-transparent text-xs font-bold text-navy outline-none cursor-pointer">
                    <option value="ALL" ${state.homeFilterMonth === 'ALL' ? 'selected' : ''}>Tất cả các tháng</option>
                    ${Array.from({ length: 12 }, (_, i) => i + 1).map(m => `
                      <option value="${m}" ${String(state.homeFilterMonth) === String(m) ? 'selected' : ''}>Tháng ${m}</option>
                    `).join('')}
                  </select>
                </div>
                <div class="flex items-center gap-1.5 bg-slate-50 border border-slate-200 rounded-xl px-2.5 py-1.5">
                  <select onchange="state.homeFilterYear = this.value; renderMain();" class="bg-transparent text-xs font-bold text-navy outline-none cursor-pointer">
                    <option value="ALL" ${state.homeFilterYear === 'ALL' ? 'selected' : ''}>Tất cả các năm</option>
                    ${yearOptions.map(y => `
                      <option value="${y}" ${state.homeFilterYear === y ? 'selected' : ''}>Năm ${y}</option>
                    `).join('')}
                  </select>
                </div>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-5 gap-3">
              <div class="p-3.5 rounded-2xl bg-slate-50 border border-slate-200">
                <div class="text-[11px] font-bold text-slate-500 uppercase">Tổng giấy phép</div>
                <div class="text-2xl font-black text-navy mt-1">${stats.total}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-amber-50 border border-amber-200">
                <div class="text-[11px] font-bold text-amber-700 uppercase">Chờ Quản lý</div>
                <div class="text-2xl font-black text-amber-700 mt-1">${stats.pendingMgmt}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-sky-50 border border-sky-200">
                <div class="text-[11px] font-bold text-sky-700 uppercase">Chờ EHS duyệt</div>
                <div class="text-2xl font-black text-sky-700 mt-1">${stats.pendingEhs}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-emerald-50 border border-emerald-200">
                <div class="text-[11px] font-bold text-emerald-700 uppercase">Đã phê duyệt</div>
                <div class="text-2xl font-black text-emerald-700 mt-1">${stats.approved}</div>
              </div>
              <div class="p-3.5 rounded-2xl bg-red-50 border border-red-200 col-span-2 sm:col-span-1">
                <div class="text-[11px] font-bold text-red-700 uppercase">Từ chối / Hủy</div>
                <div class="text-2xl font-black text-red-700 mt-1">${stats.rejected}</div>
              </div>
            </div>
          </section>

          <!-- 3. BẢNG CHỌN 3 PHÂN HỆ -->
          <section class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <button onclick="navigateTo('CONTRACTOR')" class="group text-left bg-white rounded-3xl border-2 border-slate-200 hover:border-eaton p-6 shadow-sm hover:shadow-xl transition-all duration-200 flex flex-col justify-between">
              <div>
                <div class="w-12 h-12 rounded-2xl bg-blue-50 text-eaton group-hover:bg-eaton group-hover:text-white flex items-center justify-center text-xl transition mb-4">
                  <i class="fa-solid fa-helmet-safety"></i>
                </div>
                <h3 class="text-lg font-extrabold text-navy group-hover:text-eaton transition">Nhà thầu (Contractor)</h3>
                <p class="text-xs sm:text-sm text-slate-500 mt-1.5 leading-relaxed">
                  Đăng ký giấy phép làm việc mới, chọn loại giấy phép, PPE, đánh giá JSA, nhân sự và khu vực thi công.
                </p>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-extrabold text-eaton">
                <span>Bắt đầu đăng ký</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
              </div>
            </button>

            <button onclick="navigateTo('MANAGEMENT')" class="group text-left bg-white rounded-3xl border-2 border-slate-200 hover:border-amber-500 p-6 shadow-sm hover:shadow-xl transition-all duration-200 flex flex-col justify-between">
              <div>
                <div class="w-12 h-12 rounded-2xl bg-amber-50 text-amber-600 group-hover:bg-amber-500 group-hover:text-white flex items-center justify-center text-xl transition mb-4">
                  <i class="fa-solid fa-user-tie"></i>
                </div>
                <h3 class="text-lg font-extrabold text-navy group-hover:text-amber-600 transition">Người quản lý (Management)</h3>
                <p class="text-xs sm:text-sm text-slate-500 mt-1.5 leading-relaxed">
                  Xác nhận giấy phép của nhà thầu phụ trách, tạo giấy phép thay mặt và tra cứu lịch sử thi công.
                </p>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-extrabold text-amber-600">
                <span>Đăng nhập Quản lý</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
              </div>
            </button>

            <button onclick="navigateTo('EHS')" class="group text-left bg-white rounded-3xl border-2 border-slate-200 hover:border-emerald-600 p-6 shadow-sm hover:shadow-xl transition-all duration-200 flex flex-col justify-between">
              <div>
                <div class="w-12 h-12 rounded-2xl bg-emerald-50 text-emerald-600 group-hover:bg-emerald-600 group-hover:text-white flex items-center justify-center text-xl transition mb-4">
                  <i class="fa-solid fa-shield-virus"></i>
                </div>
                <h3 class="text-lg font-extrabold text-navy group-hover:text-emerald-600 transition">Bộ phận EHS</h3>
                <p class="text-xs sm:text-sm text-slate-500 mt-1.5 leading-relaxed">
                  Kiểm tra & Phê duyệt giấy phép, thiết lập an toàn/PPE
                </p>
              </div>
              <div class="mt-5 pt-3 border-t border-slate-100 flex items-center justify-between text-xs font-extrabold text-emerald-600">
                <span>Đăng nhập EHS</span>
                <i class="fa-solid fa-arrow-right group-hover:translate-x-1 transition"></i>
              </div>
            </button>
          </section>
        </div>
      `;
    }

    // =========================================================================
    // 10. PERMIT CREATION WIZARD (SHARED BY CONTRACTOR & MANAGEMENT)
    // =========================================================================
    function renderPermitWizardContainer(container, mode) {
      const w = state.wizard;
      const steps = [
        { n: 1, label: 'Nhà thầu' },
        { n: 2, label: 'Loại GP' },
        { n: 3, label: 'Thời gian' },
        { n: 4, label: 'An toàn & JSA' },
        { n: 5, label: 'Nhân sự' },
        { n: 6, label: 'Khu vực' },
        { n: 7, label: 'Cam kết' }
      ];

      let stepBody = '';
      if (w.step === 1) stepBody = renderWizardStep1();
      else if (w.step === 2) stepBody = renderWizardStep2();
      else if (w.step === 3) stepBody = renderWizardStep3();
      else if (w.step === 4) stepBody = renderWizardStep4(mode);
      else if (w.step === 5) stepBody = renderWizardStep5();
      else if (w.step === 6) stepBody = renderWizardStep6();
      else if (w.step === 7) stepBody = renderWizardStep7();
      else if (w.step === 8) stepBody = renderWizardStep8(mode);

      container.innerHTML = `
        <div class="max-w-4xl mx-auto space-y-5">
          ${w.step <= 7 ? `
            <div class="bg-white rounded-2xl border border-slate-200 p-3.5 shadow-sm overflow-x-auto">
              <div class="flex items-center justify-between min-w-[540px] gap-1">
                ${steps.map(s => {
                  const done = w.step > s.n;
                  const active = w.step === s.n;
                  return `
                    <div class="flex-1 flex flex-col items-center relative">
                      <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-extrabold border-2 transition ${done ? 'bg-emerald-500 border-emerald-500 text-white' : active ? 'bg-eaton border-eaton text-white shadow' : 'bg-slate-50 border-slate-200 text-slate-400'}">
                        ${done ? '<i class="fa-solid fa-check"></i>' : s.n}
                      </div>
                      <span class="text-[11px] font-bold mt-1 ${active ? 'text-eaton' : done ? 'text-emerald-700' : 'text-slate-400'}">${s.label}</span>
                    </div>
                  `;
                }).join('')}
              </div>
            </div>
          ` : ''}

          <div class="bg-white rounded-3xl border border-slate-200 p-5 sm:p-7 shadow-sm">
            ${stepBody}
          </div>
        </div>
      `;
    }

    function renderWizardStep1() {
      const w = state.wizard;
      return `
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-extrabold text-navy">1. Thông tin Nhà thầu (Contractor)</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Chọn đơn vị nhà thầu từ danh sách đã được bộ phận EHS đăng ký sẵn.</p>
          </div>

          ${db.contractors.length === 0 ? `
            <div class="p-4 rounded-2xl bg-amber-50 border border-amber-200 text-xs sm:text-sm text-amber-800 font-semibold">
              <i class="fa-solid fa-circle-info mr-1.5"></i> Hiện chưa có danh sách nhà thầu. Vui lòng liên hệ bộ phận EHS để thêm nhà thầu vào hệ thống.
            </div>
          ` : `
            <div class="space-y-4">
              <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Chọn Đơn vị Nhà thầu *</label>
                <select onchange="onSelectWizardContractor(this.value)" class="w-full px-4 py-3 rounded-xl border-2 border-slate-200 focus:border-eaton bg-white text-sm font-bold text-navy outline-none">
                  <option value="">-- Chọn nhà thầu trong danh sách --</option>
                  ${db.contractors.map(c => `
                    <option value="${escapeHtml(c.id)}" ${w.contractorId === c.id ? 'selected' : ''}>${escapeHtml(c.name)} (${escapeHtml(c.id)})</option>
                  `).join('')}
                </select>
              </div>

              <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 p-4 rounded-2xl bg-slate-50 border border-slate-200">
                <div>
                  <div class="text-[11px] font-bold text-slate-400 uppercase">Tên đơn vị</div>
                  <div class="text-sm font-bold text-navy mt-1">${w.contractorName ? escapeHtml(w.contractorName) : '<span class="text-slate-400 font-normal">Chưa chọn</span>'}</div>
                </div>
                <div>
                  <div class="text-[11px] font-bold text-slate-400 uppercase">Người phụ trách</div>
                  <div class="text-sm font-bold text-navy mt-1">${w.contractorSupervisor ? escapeHtml(w.contractorSupervisor) : '<span class="text-slate-400 font-normal">—</span>'}</div>
                </div>
                <div>
                  <div class="text-[11px] font-bold text-slate-400 uppercase">Số điện thoại</div>
                  <div class="text-sm font-bold text-eaton mt-1">${w.contractorPhone ? escapeHtml(w.contractorPhone) : '<span class="text-slate-400 font-normal">—</span>'}</div>
                </div>
              </div>
            </div>
          `}

          <div class="flex justify-end pt-2">
            <button onclick="wizardNextFromStep1()" class="px-6 py-2.5 rounded-xl bg-eaton hover:bg-blue-700 text-white text-sm font-bold shadow transition">
              Tiếp tục <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function onSelectWizardContractor(ctrId) {
      const c = db.contractors.find(item => item.id === ctrId);
      if (c) {
        state.wizard.contractorId = c.id;
        state.wizard.contractorName = c.name;
        state.wizard.contractorSupervisor = c.supervisor;
        state.wizard.contractorPhone = c.phone;
      } else {
        state.wizard.contractorId = '';
        state.wizard.contractorName = '';
        state.wizard.contractorSupervisor = '';
        state.wizard.contractorPhone = '';
      }
      renderMain();
    }

    function wizardNextFromStep1() {
      if (!state.wizard.contractorId) {
        showToast('Vui lòng chọn đơn vị Nhà thầu trong danh sách.', 'warning');
        return;
      }
      state.wizard.step = 2;
      renderMain();
    }

    function renderWizardStep2() {
      const w = state.wizard;
      return `
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-extrabold text-navy">2. Đăng ký Loại Giấy phép Làm việc</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Chọn đúng loại giấy phép phù hợp với tính chất công việc thi công.</p>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            ${PERMIT_TYPES.map(pt => {
              const active = w.permitType === pt.code;
              return `
                <button onclick="selectWizardPermitType('${pt.code}')" class="text-left p-4 rounded-2xl border-2 transition flex items-start gap-3.5 ${active ? 'border-eaton bg-blue-50/70 shadow-sm' : 'border-slate-200 hover:border-slate-300 bg-white'}">
                  <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 ${active ? 'bg-eaton text-white' : 'bg-slate-100 text-slate-600'}">
                    <i class="fa-solid ${pt.icon} text-base"></i>
                  </div>
                  <div class="flex-1 min-w-0">
                    <div class="text-sm font-extrabold text-navy">${escapeHtml(pt.name)}</div>
                    <div class="text-[11px] font-semibold text-slate-500 mt-0.5">${escapeHtml(pt.ruleLabel)}</div>
                  </div>
                  <div class="w-5 h-5 rounded-full border-2 flex items-center justify-center mt-0.5 ${active ? 'border-eaton bg-eaton text-white' : 'border-slate-300'}">
                    ${active ? '<i class="fa-solid fa-check text-[10px]"></i>' : ''}
                  </div>
                </button>
              `;
            }).join('')}
          </div>

          <div class="flex justify-between pt-2">
            <button onclick="state.wizard.step = 1; renderMain();" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">
              <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
            </button>
            <button onclick="wizardNextFromStep2()" class="px-6 py-2.5 rounded-xl bg-eaton hover:bg-blue-700 text-white text-sm font-bold shadow">
              Tiếp tục <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function selectWizardPermitType(code) {
      state.wizard.permitType = code;
      const tmr = getTomorrowISO();
      state.wizard.startDate = tmr;
      state.wizard.endDate = tmr;
      applySafetyTemplateToWizard(code);
      renderMain();
    }

    function wizardNextFromStep2() {
      applySafetyTemplateToWizard(state.wizard.permitType);
      state.wizard.step = 3;
      renderMain();
    }

    function renderWizardStep3() {
      const w = state.wizard;
      const meta = getPermitTypeMeta(w.permitType);
      const minStart = getTomorrowISO();
      let maxEndAttr = '';
      if (meta.dateRule === 'MAX_7_DAYS') {
        maxEndAttr = `max="${addDaysISO(w.startDate || minStart, 6)}"`;
      }

      return `
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-extrabold text-navy">3. Chọn Ngày &amp; Thời gian Thi công</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
              Loại giấy phép: <strong class="text-eaton">${escapeHtml(meta.name)}</strong> — <span class="text-amber-700 font-semibold">${escapeHtml(meta.ruleLabel)}</span>.
            </p>
          </div>

          <div class="p-4 rounded-2xl bg-blue-50/70 border border-blue-200 text-xs text-navy flex items-start gap-2.5">
            <i class="fa-solid fa-calendar-check text-eaton text-base mt-0.5"></i>
            <div>
              <strong>Quy định đăng ký thời gian:</strong> Bắt buộc đăng ký trước tối thiểu 01 ngày (từ ngày <strong>${formatDateVN(minStart)}</strong> trở đi). Khung giờ tiêu chuẩn là <strong>08:00 ~ 17:00</strong>.
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Ngày bắt đầu thi công *</label>
              <input type="date" id="wiz-start-date" value="${escapeHtml(w.startDate)}" min="${minStart}" onchange="onWizardStartDateChange(this.value)" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-eaton text-sm font-bold text-navy outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Ngày kết thúc thi công *</label>
              <input type="date" id="wiz-end-date" value="${escapeHtml(w.endDate)}" min="${escapeHtml(w.startDate || minStart)}" ${maxEndAttr} ${meta.dateRule === 'SINGLE_DAY' ? 'disabled' : ''} onchange="state.wizard.endDate = this.value;" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-eaton text-sm font-bold text-navy outline-none ${meta.dateRule === 'SINGLE_DAY' ? 'bg-slate-100 text-slate-500 cursor-not-allowed' : ''}" />
              ${meta.dateRule === 'SINGLE_DAY' ? '<p class="text-[11px] text-amber-700 font-semibold mt-1">Loại giấy phép này chỉ cấp theo từng ngày đơn lẻ.</p>' : ''}
              ${meta.dateRule === 'MAX_7_DAYS' ? '<p class="text-[11px] text-slate-500 mt-1">Giấy phép thông thường được chọn tối đa 7 ngày liên tiếp.</p>' : ''}
              ${meta.dateRule === 'MULTI_DAY' ? '<p class="text-[11px] text-emerald-700 font-semibold mt-1">Giấy phép LOTO được phép chọn nhiều ngày liên tục.</p>' : ''}
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Giờ bắt đầu</label>
              <input type="time" value="${escapeHtml(w.startTime)}" onchange="state.wizard.startTime = this.value;" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-eaton text-sm font-bold text-navy outline-none" />
            </div>

            <div>
              <label class="block text-xs font-bold text-slate-600 uppercase mb-1.5">Giờ kết thúc</label>
              <input type="time" value="${escapeHtml(w.endTime)}" onchange="state.wizard.endTime = this.value;" class="w-full px-4 py-2.5 rounded-xl border-2 border-slate-200 focus:border-eaton text-sm font-bold text-navy outline-none" />
            </div>
          </div>

          <div class="flex justify-between pt-2">
            <button onclick="state.wizard.step = 2; renderMain();" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">
              <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
            </button>
            <button onclick="wizardNextFromStep3()" class="px-6 py-2.5 rounded-xl bg-eaton hover:bg-blue-700 text-white text-sm font-bold shadow">
              Tiếp tục <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function onWizardStartDateChange(val) {
      const meta = getPermitTypeMeta(state.wizard.permitType);
      state.wizard.startDate = val;
      if (meta.dateRule === 'SINGLE_DAY') {
        state.wizard.endDate = val;
      } else if (meta.dateRule === 'MAX_7_DAYS') {
        const maxAllowed = addDaysISO(val, 6);
        if (!state.wizard.endDate || state.wizard.endDate < val) state.wizard.endDate = val;
        if (state.wizard.endDate > maxAllowed) state.wizard.endDate = maxAllowed;
      } else {
        if (!state.wizard.endDate || state.wizard.endDate < val) state.wizard.endDate = val;
      }
      renderMain();
    }

    function wizardNextFromStep3() {
      const w = state.wizard;
      const minStart = getTomorrowISO();
      const meta = getPermitTypeMeta(w.permitType);
      if (!w.startDate || w.startDate < minStart) {
        showToast('Chỉ được đăng ký từ ngày mai trở đi (trước tối thiểu 1 ngày).', 'warning');
        return;
      }
      if (!w.endDate || w.endDate < w.startDate) {
        showToast('Ngày kết thúc không hợp lệ.', 'warning');
        return;
      }
      if (meta.dateRule === 'SINGLE_DAY' && w.endDate !== w.startDate) {
        w.endDate = w.startDate;
      }
      if (meta.dateRule === 'MAX_7_DAYS' && w.endDate > addDaysISO(w.startDate, 6)) {
        showToast('Giấy phép thông thường chỉ được đăng ký tối đa 7 ngày.', 'warning');
        return;
      }
      w.step = 4;
      renderMain();
    }

    function renderWizardStep4(mode) {
      const w = state.wizard;
      const meta = getPermitTypeMeta(w.permitType);

      if (mode === 'MANAGEMENT' && state.currentManager && !w.managerUsername) {
        w.managerUsername = state.currentManager.username;
        w.managerName = state.currentManager.fullName;
        w.department = state.currentManager.department;
      }

      const allPpeList = Array.from(new Set([...STANDARD_PPE_OPTIONS, ...(w.ppe || [])]));

      return `
        <div class="space-y-6">
          <div>
            <h3 class="text-lg font-extrabold text-navy">4. Thông tin Dự án, Yêu cầu PPE, An toàn &amp; JSA</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">
              Loại giấy phép: <strong class="text-eaton">${escapeHtml(meta.name)}</strong> • Ngày thi công: <strong>${formatDateVN(w.startDate)} → ${formatDateVN(w.endDate)}</strong> (${w.startTime} - ${w.endTime})
            </p>
          </div>

          <div class="p-4 rounded-2xl bg-slate-50 border border-slate-200 space-y-3.5">
            <div class="text-xs font-extrabold text-navy uppercase tracking-wide flex items-center gap-1.5">
              <i class="fa-solid fa-briefcase text-eaton"></i> Thông tin Dự án &amp; Bộ phận Quản lý
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Người quản lý dự án (BOYD) *</label>
                <select onchange="onSelectWizardManager(this.value)" class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm font-bold text-navy outline-none focus:border-eaton">
                  <option value="">-- Chọn người quản lý tiếp nhận --</option>
                  ${db.managers.map(m => `
                    <option value="${escapeHtml(m.username)}" ${w.managerUsername === m.username ? 'selected' : ''}>${escapeHtml(m.fullName)} — ${escapeHtml(m.department)}</option>
                  `).join('')}
                </select>
              </div>
              <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">Bộ phận quản lý *</label>
                <input type="text" value="${escapeHtml(w.department)}" oninput="state.wizard.department = this.value" placeholder="Tự động điền theo người quản lý..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-eaton" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-slate-600 mb-1">Tên dự án / Hạng mục công việc *</label>
                <input type="text" value="${escapeHtml(w.projectName)}" oninput="state.wizard.projectName = this.value" placeholder="VD: Lắp đặt hệ thống ống gió làm mát xưởng B1..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-eaton" />
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-slate-600 mb-1">Mô tả chi tiết công việc *</label>
                <textarea rows="2" oninput="state.wizard.workDescription = this.value" placeholder="Mô tả các hạng mục sẽ thực hiện..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-eaton">${escapeHtml(w.workDescription)}</textarea>
              </div>
              <div class="sm:col-span-2">
                <label class="block text-xs font-bold text-slate-600 mb-1">Vị trí / Địa điểm cụ thể *</label>
                <input type="text" value="${escapeHtml(w.locationDetail)}" oninput="state.wizard.locationDetail = this.value" placeholder="VD: Cột B3-B5, gần line lắp ráp số 2..." class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-white text-sm outline-none focus:border-eaton" />
              </div>
            </div>
          </div>

          <div class="p-4 rounded-2xl bg-indigo-50/60 border border-indigo-200 space-y-3">
            <div class="text-xs font-extrabold text-indigo-900 uppercase tracking-wide flex items-center gap-1.5">
              <i class="fa-solid fa-vest-patches text-indigo-600"></i> Yêu cầu Trang bị Bảo hộ Cá nhân (PPE) bắt buộc
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
              ${allPpeList.map(item => {
                const checked = (w.ppe || []).includes(item);
                return `
                  <label class="flex items-center gap-2.5 p-2.5 rounded-xl border cursor-pointer transition ${checked ? 'bg-white border-indigo-400 shadow-sm' : 'bg-white/60 border-slate-200 hover:bg-white'}">
                    <input type="checkbox" ${checked ? 'checked' : ''} onchange="toggleWizardPpe('${escapeHtml(item).replace(/'/g, "\\'")}', this.checked)" class="w-4 h-4 accent-indigo-600 rounded" />
                    <span class="text-xs font-semibold text-slate-700">${escapeHtml(item)}</span>
                  </label>
                `;
              }).join('')}
            </div>
            <div class="flex gap-2 pt-1">
              <input type="text" id="wiz-custom-ppe" placeholder="Thêm yêu cầu PPE đặc thù khác..." class="flex-1 px-3 py-2 rounded-xl border border-indigo-200 bg-white text-xs outline-none focus:border-indigo-500" />
              <button onclick="addWizardCustomPpe()" class="px-3.5 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold">+ Thêm PPE</button>
            </div>
          </div>

          <div class="p-4 rounded-2xl bg-amber-50/60 border border-amber-200 space-y-2.5">
            <div class="text-xs font-extrabold text-amber-900 uppercase tracking-wide flex items-center gap-1.5">
              <i class="fa-solid fa-shield-halved text-amber-600"></i> Các Yêu cầu An toàn cho ${escapeHtml(meta.name)}
            </div>
            <ul class="space-y-1.5 text-xs text-slate-700">
              ${w.safetyRequirements.map((req, idx) => `
                <li class="flex items-start gap-2 bg-white/90 p-2.5 rounded-xl border border-amber-100">
                  <span class="w-5 h-5 rounded-full bg-amber-100 text-amber-800 font-bold text-[10px] flex items-center justify-center shrink-0 mt-0.5">${idx + 1}</span>
                  <span class="flex-1">${escapeHtml(req)}</span>
                </li>
              `).join('')}
            </ul>
          </div>

          <div class="space-y-2.5">
            <div class="flex items-center justify-between">
              <div class="text-xs font-extrabold text-navy uppercase tracking-wide flex items-center gap-1.5">
                <i class="fa-solid fa-table-list text-eaton"></i> Bảng Từng bước Công việc &amp; Đánh giá Rủi ro (JSA)
              </div>
              <button onclick="addWizardJsaRow()" class="px-3 py-1.5 rounded-lg bg-blue-50 hover:bg-blue-100 text-eaton text-xs font-bold">+ Thêm bước JSA</button>
            </div>
            <div class="overflow-x-auto rounded-2xl border border-slate-200">
              <table class="w-full text-xs">
                <thead class="bg-navy text-white">
                  <tr>
                    <th class="p-2.5 text-left w-10">#</th>
                    <th class="p-2.5 text-left">Bước công việc</th>
                    <th class="p-2.5 text-left">Mối nguy tiềm ẩn</th>
                    <th class="p-2.5 text-left">Biện pháp kiểm soát an toàn</th>
                    <th class="p-2.5 w-10"></th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-200 bg-white">
                  ${w.jsa.map((row, idx) => `
                    <tr>
                      <td class="p-2 font-bold text-slate-500 text-center">${idx + 1}</td>
                      <td class="p-1.5"><input type="text" value="${escapeHtml(row.step)}" oninput="state.wizard.jsa[${idx}].step = this.value" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 focus:border-eaton outline-none" /></td>
                      <td class="p-1.5"><input type="text" value="${escapeHtml(row.hazard)}" oninput="state.wizard.jsa[${idx}].hazard = this.value" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 focus:border-eaton outline-none" /></td>
                      <td class="p-1.5"><input type="text" value="${escapeHtml(row.control)}" oninput="state.wizard.jsa[${idx}].control = this.value" class="w-full px-2.5 py-1.5 rounded-lg border border-slate-200 focus:border-eaton outline-none" /></td>
                      <td class="p-1.5 text-center">
                        ${w.jsa.length > 1 ? `<button onclick="state.wizard.jsa.splice(${idx}, 1); renderMain();" class="text-red-400 hover:text-red-600 p-1"><i class="fa-solid fa-trash-can"></i></button>` : ''}
                      </td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          </div>

          <div class="flex justify-between pt-2">
            <button onclick="state.wizard.step = 3; renderMain();" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">
              <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
            </button>
            <button onclick="wizardNextFromStep4()" class="px-6 py-2.5 rounded-xl bg-eaton hover:bg-blue-700 text-white text-sm font-bold shadow">
              Tiếp tục <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function onSelectWizardManager(username) {
      const m = db.managers.find(item => item.username === username);
      if (m) {
        state.wizard.managerUsername = m.username;
        state.wizard.managerName = m.fullName;
        state.wizard.department = m.department;
      } else {
        state.wizard.managerUsername = '';
        state.wizard.managerName = '';
        state.wizard.department = '';
      }
      renderMain();
    }

    function toggleWizardPpe(label, checked) {
      if (!Array.isArray(state.wizard.ppe)) state.wizard.ppe = [];
      if (checked) {
        if (!state.wizard.ppe.includes(label)) state.wizard.ppe.push(label);
      } else {
        state.wizard.ppe = state.wizard.ppe.filter(item => item !== label);
      }
    }

    function addWizardCustomPpe() {
      const input = document.getElementById('wiz-custom-ppe');
      const val = input ? input.value.trim() : '';
      if (!val) return;
      if (!state.wizard.ppe.includes(val)) state.wizard.ppe.push(val);
      renderMain();
    }

    function addWizardJsaRow() {
      state.wizard.jsa.push({ step: '', hazard: '', control: '' });
      renderMain();
    }

    function wizardNextFromStep4() {
      const w = state.wizard;
      if (!w.managerUsername) { showToast('Vui lòng chọn Người quản lý dự án.', 'warning'); return; }
      if (!w.department.trim()) { showToast('Vui lòng nhập Bộ phận quản lý.', 'warning'); return; }
      if (!w.projectName.trim()) { showToast('Vui lòng nhập Tên dự án / Hạng mục.', 'warning'); return; }
      if (!w.workDescription.trim()) { showToast('Vui lòng mô tả chi tiết công việc.', 'warning'); return; }
      if (!w.locationDetail.trim()) { showToast('Vui lòng nhập Vị trí cụ thể.', 'warning'); return; }
      if (!w.ppe || w.ppe.length === 0) { showToast('Vui lòng chọn ít nhất 01 yêu cầu PPE.', 'warning'); return; }
      w.step = 5;
      renderMain();
    }

    function renderWizardStep5() {
      const w = state.wizard;
      return `
        <div class="space-y-5">
          <div class="flex items-center justify-between flex-wrap gap-2">
            <div>
              <h3 class="text-lg font-extrabold text-navy">5. Đăng ký Danh sách Người làm việc</h3>
              <p class="text-xs sm:text-sm text-slate-500 mt-1">Khai báo đầy đủ Họ tên, Tuổi và Số CCCD của toàn bộ nhân sự vào nhà máy.</p>
            </div>
            <button onclick="state.wizard.workers.push({ name: '', age: '', idCard: '' }); renderMain();" class="px-3.5 py-2 rounded-xl bg-blue-50 hover:bg-blue-100 text-eaton text-xs font-extrabold">
              <i class="fa-solid fa-user-plus mr-1"></i> Thêm người
            </button>
          </div>

          <div class="space-y-2.5">
            ${w.workers.map((wk, idx) => `
              <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 p-3 rounded-2xl bg-slate-50 border border-slate-200 items-center">
                <div class="sm:col-span-1 text-xs font-extrabold text-slate-500 text-center">#${idx + 1}</div>
                <div class="sm:col-span-5">
                  <input type="text" value="${escapeHtml(wk.name)}" oninput="state.wizard.workers[${idx}].name = this.value" placeholder="Họ và tên *" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs sm:text-sm outline-none focus:border-eaton" />
                </div>
                <div class="sm:col-span-2">
                  <input type="number" min="18" max="65" value="${escapeHtml(wk.age)}" oninput="state.wizard.workers[${idx}].age = this.value" placeholder="Tuổi *" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs sm:text-sm outline-none focus:border-eaton" />
                </div>
                <div class="sm:col-span-3">
                  <input type="text" value="${escapeHtml(wk.idCard)}" oninput="state.wizard.workers[${idx}].idCard = this.value" placeholder="Số CCCD / CMND *" class="w-full px-3 py-2 rounded-xl border border-slate-300 bg-white text-xs sm:text-sm outline-none focus:border-eaton" />
                </div>
                <div class="sm:col-span-1 text-center">
                  ${w.workers.length > 1 ? `
                    <button onclick="state.wizard.workers.splice(${idx}, 1); renderMain();" class="p-2 text-red-500 hover:bg-red-50 rounded-lg transition">
                      <i class="fa-solid fa-trash-can"></i>
                    </button>
                  ` : ''}
                </div>
              </div>
            `).join('')}
          </div>

          <div class="flex justify-between pt-2">
            <button onclick="state.wizard.step = 4; renderMain();" class="px-5 py-2.5 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-bold">
              <i class="fa-solid fa-arrow-left mr-1"></i> Quay lại
            </button>
            <button onclick="wizardNextFromStep5()" class="px-6 py-2.5 rounded-xl bg-eaton hover:bg-blue-700 text-white text-sm font-bold shadow">
              Tiếp tục <i class="fa-solid fa-arrow-right ml-1.5"></i>
            </button>
          </div>
        </div>
      `;
    }

    function wizardNextFromStep5() {
      const valid = state.wizard.workers.every(wk => wk.name.trim() && String(wk.age).trim() && wk.idCard.trim());
      if (!valid || state.wizard.workers.length === 0) {
        showToast('Vui lòng nhập đầy đủ Tên, Tuổi và CCCD cho tất cả người làm việc.', 'warning');
        return;
      }
      state.wizard.step = 6;
      renderMain();
    }

    function renderZoneGridMap(factoryCode, floorName, selectedZoneId, clickable = true, allowDelete = false) {
      const allFactoryZones = db.zones[factoryCode] || [];
      const zones = allFactoryZones.filter(z => (z.floor || 'Tầng 1') === floorName);

      return `
        <div class="bg-slate-900 rounded-2xl border-2 border-slate-700 p-4 shadow-inner space-y-3">
          <div class="flex items-center justify-between flex-wrap gap-2 border-b border-slate-700/80 pb-2.5">
            <div class="text-xs font-extrabold text-sky-300 uppercase tracking-wider flex items-center gap-2">
              <i class="fa-solid fa-layer-group"></i>
              Mặt bằng Nhà máy ${escapeHtml(factoryCode)} — ${escapeHtml(floorName)}
            </div>
            <span class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-300 border border-slate-700">
              ${zones.length} ô khu vực
            </span>
          </div>

          ${zones.length === 0 ? `
            <div class="py-10 text-center text-slate-400 text-xs border-2 border-dashed border-slate-700 rounded-xl">
              <i class="fa-regular fa-square-plus text-2xl mb-2 block text-slate-500"></i>
              Chưa có khu vực nào được thiết lập tại <strong>${escapeHtml(factoryCode)} — ${escapeHtml(floorName)}</strong>.
            </div>
          ` : `
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3">
              ${zones.map(z => {
                const isActive = z.id === selectedZoneId;
                return `
                  <div ${clickable ? `onclick="selectWizardZone('${escapeHtml(z.id)}')"` : ''} class="relative rounded-xl border-2 p-3.5 min-h-[96px] flex flex-col justify-between transition ${clickable ? 'cursor-pointer' : ''} ${isActive ? 'zone-active bg-red-600/90 border-yellow-300 text-white shadow-lg' : 'bg-blue-950/75 border-blue-400/50 text-slate-100 ' + (clickable ? 'hover:border-sky-300 hover:bg-blue-900/80' : '')}">
                    <div class="flex items-start justify-between gap-1.5">
                      <span class="font-mono text-[11px] font-extrabold px-2 py-0.5 rounded ${isActive ? 'bg-yellow-300 text-red-900' : 'bg-slate-800/90 text-sky-300'}">
                        ${escapeHtml(z.id)}
                      </span>
                      ${allowDelete ? `
                        <button onclick="event.stopPropagation(); deleteEhsMapZone('${escapeHtml(factoryCode)}', '${escapeHtml(z.id)}')" class="w-6 h-6 rounded-lg bg-red-500/20 hover:bg-red-600 text-red-300 hover:text-white flex items-center justify-center transition" title="Xóa khu vực">
                          <i class="fa-solid fa-trash-can text-[11px]"></i>
                        </button>
                      ` : (isActive ? '<i class="fa-solid fa-location-dot text-yellow-300 text-base"></i>' : '<i class="fa-regular fa-square text-slate-500 text-sm"></i>')}
                    </div>
                    <div class="mt-2 font-bold text-xs sm:text-[13px] leading-snug ${isActive ? 'text-white' : 'text-slate-100'}">
                      ${escapeHtml(z.name)}
                    </div>
                  </div>
                `;
              }).join('')}
            </div>
          `}
        </div>
      `;
    }

    function renderWizardStep6() {
      const w = state.wizard;

      return `
        <div class="space-y-5">
          <div>
            <h3 class="text-lg font-extrabold text-navy">6. Đăng ký Khu vực Làm việc (Nhà máy → Tầng → Khu vực)</h3>
            <p class="text-xs sm:text-sm text-slate-500 mt-1">Chọn Nhà máy, chọn Tầng và bấm trực tiếp vào ô Khu vực thi công để phát sáng trên sơ đồ.</p>
          </div>

          <div class="space-y-2">

    function generateNextPermitId() {
      const year = new Date().getFullYear();
      const prefix = `PTW-${year}-`;
      let maxNum = 0;
      [...db.permits, ...db.deletedPermits].forEach(item => {
        if (item.id && item.id.startsWith(prefix)) {
          const n = parseInt(item.id.slice(prefix.length), 10);
          if (!isNaN(n) && n > maxNum) maxNum = n;
        }
      });
      return `${prefix}${String(maxNum + 1).padStart(3, '0')}`;
    }

    async function submitPermitWizard() {
      const w = state.wizard;
      if (!w.agreed) {
        showToast('Vui lòng tích chọn đồng ý Cam kết an toàn trước khi tiếp tục.', 'warning');
        return;
      }

      if (supabaseClient) {
        await DB.refreshFromCloud(true);
      }

      const newId = generateNextPermitId();
      const newPermit = {
        id: newId,
        contractorId: w.contractorId,
        contractorName: w.contractorName,
        contractorSupervisor: w.contractorSupervisor,
        contractorPhone: w.contractorPhone,
        permitType: w.permitType,
        startDate: w.startDate,
        endDate: w.endDate,
        startTime: w.startTime,
        endTime: w.endTime,
        department: w.department.trim(),
        managerUsername: w.managerUsername,
        managerName: w.managerName,
        projectName: w.projectName.trim(),
        workDescription: w.workDescription.trim(),
        locationDetail: w.locationDetail.trim(),
        factory: w.factory,
        floor: w.floor || 'Tầng 1',
        zoneId: w.zoneId,
        zoneName: w.zoneName,
        ppe: [...(w.ppe || [])],
        safetyRequirements: [...w.safetyRequirements],
        jsa: w.jsa.map(item => ({ ...item })),
        workers: w.workers.map(wk => ({ name: wk.name.trim(), age: String(wk.age).trim(), idCard: wk.idCard.trim() })),
        agreed: true,
        status: 'PENDING_MANAGER',
        createdAt: new Date().toISOString(),
        managerApprovedAt: null,
        ehsApprovedAt: null,
        rejectReason: '',
        archived: false
      };

      db.permits.unshift(newPermit);
      await DB.upsertPermit(newPermit);

      if (w.addAnother) {
        const keepCtr = {
          contractorId: w.contractorId,
          contractorName: w.contractorName,
          contractorSupervisor: w.contractorSupervisor,
          contractorPhone: w.contractorPhone
        };
        state.wizard = { ...createEmptyWizard(), ...keepCtr, step: 2 };
        applySafetyTemplateToWizard('GENERAL');
        showToast(`Đã tạo giấy phép ${newId}! Tiếp tục đăng ký giấy phép mới.`, 'success');
        renderMain();
      } else {
        state.wizard.lastCreatedId = newId;
        state.wizard.step = 8;
        showToast(`Đăng ký thành công mã giấy phép ${newId}!`, 'success');
        renderMain();
      }
    }

    async function handleManagerLogin() {
      const username = document.getElementById('mgmt-login-user')?.value;
      const password = document.getElementById('mgmt-login-pass')?.value || '';
      if (!username) { showToast('Vui lòng chọn tài khoản Người quản lý.', 'warning'); return; }
      if (supabaseClient) await DB.refreshFromCloud(true);
      const found = db.managers.find(m => m.username === username && m.password === password);
      if (!found) { showToast('Mật khẩu không chính xác.', 'error'); return; }
      state.currentManager = found;
      state.mgmtTab = 'APPROVE';
      state.mgmtSelectedContractor = null;
      showToast(`Xin chào ${found.fullName}!`, 'success');
      renderAll();
    }

    async function handleManagerRegister() {
      const fullName = document.getElementById('mgmt-reg-name')?.value.trim();
      const department = document.getElementById('mgmt-reg-dept')?.value.trim();
      const username = document.getElementById('mgmt-reg-user')?.value.trim();
      const password = document.getElementById('mgmt-reg-pass')?.value.trim();
      if (!fullName || !department || !username || !password) {
        showToast('Vui lòng điền đầy đủ các trường thông tin.', 'warning');
        return;
      }
      if (supabaseClient) await DB.refreshFromCloud(true);
      if (db.managers.some(m => m.username.toLowerCase() === username.toLowerCase())) {
        showToast('Tên đăng nhập đã tồn tại.', 'error');
        return;
      }
      db.managers.push({ username, password, fullName, department });
      await DB.saveSetting('managers', db.managers);
      state.mgmtAuthMode = 'login';
      showToast('Đã tạo tài khoản Người quản lý thành công!', 'success');
      renderMain();
    }

    async function processApproval(permitId, role, isApproved) {
      const p = db.permits.find(item => item.id === permitId);
      if (!p) return;
      const reason = document.getElementById('approval-reject-reason')?.value.trim() || '';

      if (role === 'MANAGER') {
        if (isApproved) {
          p.status = 'PENDING_EHS';
          p.managerApprovedAt = new Date().toISOString();
          showToast(`Đã xác nhận ${p.id} và chuyển sang bộ phận EHS!`, 'success');
        } else {
          p.status = 'REJECTED_MANAGER';
          p.rejectReason = reason || 'Người quản lý từ chối xác nhận';
          showToast(`Đã từ chối giấy phép ${p.id} (vẫn lưu lịch sử).`, 'info');
        }
      } else {
        if (isApproved) {
          p.status = 'APPROVED';
          p.ehsApprovedAt = new Date().toISOString();
          showToast(`EHS đã phê duyệt ${p.id}! Giấy phép đã chuyển sang Tổng hợp.`, 'success');
        } else {
          p.status = 'REJECTED_EHS';
          p.rejectReason = reason || 'Bộ phận EHS không phê duyệt';
          showToast(`EHS đã từ chối giấy phép ${p.id}.`, 'info');
        }
      }

      await DB.upsertPermit(p);
      closeModal();
      renderMain();
    }

    async function handleEhsLogin() {
      const u = document.getElementById('ehs-login-user')?.value.trim();
      const p = document.getElementById('ehs-login-pass')?.value || '';
      if (supabaseClient) await DB.refreshFromCloud(true);
      if (u === db.ehsAccount.username && p === db.ehsAccount.password) {
        state.ehsLoggedIn = true;
        state.ehsTab = 'APPROVE';
        showToast('Đăng nhập EHS thành công!', 'success');
        renderAll();
      } else {
        showToast('Tên đăng nhập hoặc mật khẩu EHS không đúng.', 'error');
      }
    }

    function renderEhsSummaryTab(container) {
      const year = state.ehsCalYear;
      const month = state.ehsCalMonth;
      const monthStr = `${year}-${String(month + 1).padStart(2, '0')}`;
      const approvedPermits = db.permits.filter(p => p.status === 'APPROVED');

      const firstDay = new Date(year, month, 1);
      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const startWeekday = (firstDay.getDay() + 6) % 7;

      const permitCoversDate = (p, iso) => p.startDate <= iso && p.endDate >= iso;
      const monthStartISO = `${monthStr}-01`;
      const monthEndISO = `${monthStr}-${String(daysInMonth).padStart(2, '0')}`;
      const permitInMonth = (p) => p.startDate <= monthEndISO && p.endDate >= monthStartISO;

      const displayedPermits = state.ehsSelectedDate
        ? approvedPermits.filter(p => permitCoversDate(p, state.ehsSelectedDate))
        : approvedPermits.filter(p => permitInMonth(p));

      let calCells = '';
      for (let i = 0; i < startWeekday; i++) {
        calCells += `<div class="h-11 rounded-xl bg-slate-50/50"></div>`;
      }
      for (let day = 1; day <= daysInMonth; day++) {
        const iso = `${monthStr}-${String(day).padStart(2, '0')}`;
        const dayCount = approvedPermits.filter(p => permitCoversDate(p, iso)).length;
        const isSelected = state.ehsSelectedDate === iso;
        calCells += `
          <button onclick="state.ehsSelectedDate = '${iso}'; renderMain();" class="h-11 rounded-xl border text-xs font-bold flex flex-col items-center justify-center relative transition ${isSelected ? 'bg-eaton text-white border-eaton shadow' : dayCount > 0 ? 'bg-emerald-50 border-emerald-200 text-navy hover:bg-emerald-100' : 'bg-white border-slate-100 text-slate-600 hover:bg-slate-50'}">
            <span>${day}</span>
            ${dayCount > 0 ? `<span class="w-1.5 h-1.5 rounded-full mt-0.5 ${isSelected ? 'bg-yellow-300' : 'bg-emerald-500'}"></span>` : ''}
          </button>
        `;
      }

      container.innerHTML = `
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-5">
          <div class="lg:col-span-4 space-y-4">
            <div class="bg-white rounded-2xl border border-slate-200 p-4 shadow-sm space-y-3">
              <div class="flex items-center justify-between">
                <button onclick="changeEhsCalendarMonth(-1)" class="w-8 h-8 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 flex items-center justify-center">

              <div class="grid grid-cols-7 gap-1">${calCells}</div>

              <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px]">
                <span class="text-slate-500 flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> Ngày có giấy phép</span>

              </div>
              ${db.deletedPermits.length === 0 ? `
                <div class="text-xs text-slate-400 italic">Chưa có giấy phép nào bị xóa.</div>
              ` : `
                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                  ${db.deletedPermits.map(d => `
                    <div class="p-2.5 rounded-xl bg-red-50/70 border border-red-200 text-[11px] space-y-0.5">

                        <span class="font-mono text-red-700">${escapeHtml(d.id)}</span>

                    </div>
                  `).join('')}

              `}

          <div class="lg:col-span-8 bg-white rounded-2xl border border-slate-200 p-5 shadow-sm space-y-4">
            <div class="flex flex-wrap items-center justify-between gap-2 border-b border-slate-100 pb-3">
              <div>
                <h3 class="text-base font-extrabold text-navy">
                  ${state.ehsSelectedDate ? `Giấy phép ngày ${formatDateVN(state.ehsSelectedDate)}` : `Tất cả Giấy phép trong Tháng ${month + 1}/${year}`}

                <p class="text-xs text-slate-500">Bấm vào từng dòng hoặc nút In để xem trọn bộ 4 tờ A4 có đóng dấu đỏ chéo.</p>

            ${displayedPermits.length === 0 ? `

              </div>
            ` : `
              <div class="space-y-3">
                ${displayedPermits.map(p => `
                  <div class="p-4 rounded-2xl border border-slate-200 hover:border-eaton bg-slate-50/40 transition flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div onclick="openPrintPermitModal('${escapeHtml(p.id)}')" class="flex-1 cursor-pointer space-y-1">
                      <div class="flex flex-wrap items-center gap-2">
                        <span class="font-mono text-xs font-extrabold text-eaton">${escapeHtml(p.id)}</span>
                        <span class="px-2 py-0.5 rounded-md bg-blue-50 text-eaton text-[11px] font-bold">${escapeHtml(getPermitTypeMeta(p.permitType).name)}</span>
                        ${p.archived ? '<span class="px-2 py-0.5 rounded-md bg-slate-200 text-slate-600 text-[10px] font-bold">Đã sao lưu ZIP</span>' : ''}
                      </div>
                      <div class="text-sm font-extrabold text-navy">${escapeHtml(p.projectName)}</div>
                      <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1 text-xs text-slate-600 pt-0.5">
                        <div><strong>Nhà thầu:</strong> ${escapeHtml(p.contractorName)}</div>
                        <div><strong>Khu vực:</strong> ${escapeHtml(p.factory)} • ${escapeHtml(p.floor || 'Tầng 1')} — ${escapeHtml(p.zoneName)}</div>

                      </button>
                    </div>
                  </div>
                `).join('')}
              </div>
            `}
          </div>
        </div>
      `;
    }

    function changeEhsCalendarMonth(delta) {
      let m = state.ehsCalMonth + delta;
      let y = state.ehsCalYear;
      if (m < 0) { m = 11; y--; }
      if (m > 11) { m = 0; y++; }
      state.ehsCalMonth = m;
      state.ehsCalYear = y;
      state.ehsSelectedDate = null;
      renderMain();
    }

      const p = db.permits.find(item => item.id === permitId);

            <div class="flex justify-end gap-2 pt-1">
              <button onclick="closeModal()" class="px-4 py-2 rounded-xl bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold">Hủy</button>
              <button onclick="confirmDeletePermit('${escapeHtml(p.id)}')" class="px-5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-extrabold shadow">Xác nhận Xóa</button>
            </div>
          </div>
        </div>
      `;
    }

    async function confirmDeletePermit(permitId) {
      const reason = document.getElementById('delete-permit-reason')?.value.trim();
      if (!reason) {
        showToast('Vui lòng nhập lý do xóa giấy phép.', 'warning');
        return;
      }
      const idx = db.permits.findIndex(item => item.id === permitId);
      if (idx >= 0) {
        const [removed] = db.permits.splice(idx, 1);
        const deletedRecord = {
          id: removed.id,
          projectName: removed.projectName,
          contractorName: removed.contractorName,
          startDate: removed.startDate,
          deleteReason: reason,
          deletedBy: db.ehsAccount.username,
          deletedAt: new Date().toISOString()
        };
        db.deletedPermits.unshift(deletedRecord);
        await DB.deletePermit(removed.id, deletedRecord);
        closeModal();
        showToast(`Đã xóa giấy phép ${permitId} và lưu lịch sử.`, 'info');
        renderMain();
      }
    }

    async function addEhsMapZone() {
      const f = document.getElementById('map-new-factory')?.value || state.ehsMapFactory;
      const fl = document.getElementById('map-new-floor')?.value || state.ehsMapFloor;
      const name = document.getElementById('map-new-name')?.value.trim();
      if (!name) { showToast('Vui lòng nhập Tên khu vực.', 'warning'); return; }

      if (!Array.isArray(db.zones[f])) db.zones[f] = [];
      const floorCode = fl === 'Tầng mái' ? 'TM' : fl === 'Outside' ? 'OUT' : 'T' + fl.replace(/\D/g, '');
      const sameFloorCount = db.zones[f].filter(z => (z.floor || 'Tầng 1') === fl).length + 1;
      const id = `${f}-${floorCode}-${String(sameFloorCount).padStart(2, '0')}`;

      db.zones[f].push({ id, floor: fl, name });
      await DB.saveSetting('zones', db.zones);
      state.ehsMapFactory = f;
      state.ehsMapFloor = fl;
      showToast(`Đã thêm ô khu vực ${id} (${name})!`, 'success');
      renderMain();
    }

    async function executeMonthlyZipBackup() {
      const monthVal = document.getElementById('backup-month-picker')?.value;
      if (!monthVal) { showToast('Vui lòng chọn tháng cần sao lưu.', 'warning'); return; }

      const targets = db.permits.filter(p => (p.startDate || '').startsWith(monthVal));
      if (targets.length === 0) {
        showToast(`Không có giấy phép nào trong tháng ${monthVal} để sao lưu.`, 'warning');
        return;
      }

      try {
        const zip = new JSZip();
        const csvHeader = '\uFEFFMa_GP,Loai_GP,Du_An,Nha_Thau,Nguoi_Quan_Ly,Bo_Phan,Ngay_Bat_Dau,Ngay_Ket_Thuc,Khu_Vuc,So_Nguoi,Trang_Thai\n';
        const csvRows = targets.map(p => [
          p.id,
          getPermitTypeMeta(p.permitType).name,
          p.projectName,
          p.contractorName,
          p.managerName,
          p.department,
          p.startDate,
          p.endDate,
          `${p.factory} - ${p.floor || 'Tầng 1'} - ${p.zoneName}`,
          (p.workers || []).length,
          p.status
        ].map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');

        zip.file(`Tong_hop_EPTW_${monthVal}.csv`, csvHeader + csvRows);
        const detailFolder = zip.folder('Chi_tiet_Giay_phep');
        targets.forEach(p => {
          detailFolder.file(`${p.id}.json`, JSON.stringify(p, null, 2));
        });

        const blob = await zip.generateAsync({ type: 'blob' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `BOYD_EPTW_Backup_${monthVal}.zip`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        URL.revokeObjectURL(url);

        targets.forEach(p => {
          p.archived = true;
          p.ppe = [];
          p.safetyRequirements = [];
          p.jsa = [];
          p.workDescription = `[Đã sao lưu vào file BOYD_EPTW_Backup_${monthVal}.zip]`;
        });
        await DB.upsertPermitsBatch(targets);
        closeModal();
        showToast(`Đã tải xuống BOYD_EPTW_Backup_${monthVal}.zip (${targets.length} giấy phép)!`, 'success');
        renderMain();
      } catch (err) {
        console.error(err);
        showToast('Lỗi tạo file ZIP sao lưu.', 'error');
      }
    }
